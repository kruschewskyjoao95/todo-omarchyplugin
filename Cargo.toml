[package]
name = "omarchy-daily-tasks"
version = "1.0.0"
edition = "2021"
description = "Daily Todos + Tasks & Time Tracker unified backend for Omarchy (Rust)"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
strip = true
